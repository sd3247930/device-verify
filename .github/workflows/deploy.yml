name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 构建
        run: npm run build
      - name: 校验产物（manifest 与 SW 必须带 /device-verify/ 前缀）
        run: |
          set -e
          echo "--- manifest ---"
          cat dist/manifest.webmanifest
          grep -q '"start_url":"/device-verify/"' dist/manifest.webmanifest
          grep -q '"scope":"/device-verify/"' dist/manifest.webmanifest
          grep -q '"id":"/device-verify/"' dist/manifest.webmanifest
          echo "--- sw ---"
          grep -o 'createHandlerBoundToURL("[^"]*")' dist/sw.js
          grep -q '/device-verify/index.html' dist/sw.js
      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
