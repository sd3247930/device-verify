name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装网页依赖
        run: npm ci

      - name: 构建网页（供 APK 内置离线兜底）
        run: npm run build

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 写入签名文件
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 secret SIGNING_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          ls -l android/app/release.keystore

      - name: 构建 release APK
        working-directory: android
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/android/app/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 校验 APK（包名 / 版本 / 图标 / 已签名）
        run: |
          set -e
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/aapt2" dump badging "$APK" | head -20
          echo "--- 校验关键字段 ---"
          BADGING=$("$BT/aapt2" dump badging "$APK")
          echo "$BADGING" | grep -q "package: name='io.github.sd3247930.deviceverify'" || { echo "::error::包名不对"; exit 1; }
          echo "$BADGING" | grep -q "application-label:'设备校验提醒器'" || { echo "::error::应用名不对"; exit 1; }
          echo "$BADGING" | grep -q "application-icon-480" || { echo "::error::缺少图标"; exit 1; }
          "$BT/apksigner" verify --print-certs "$APK" | head -5

      - name: 重命名产物
        run: |
          set -e
          VERSION=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          cp android/app/build/outputs/apk/release/app-release.apk "device-verify-${VERSION}.apk"
          # 固定名产物：供网页永久直链 releases/latest/download/device-verify.apk
          cp android/app/build/outputs/apk/release/app-release.apk device-verify.apk
          sha256sum device-verify.apk | tee device-verify.apk.sha256
          sha256sum "device-verify-${VERSION}.apk" | tee "device-verify-${VERSION}.apk.sha256"

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: device-verify-apk
          path: |
            device-verify-*.apk
            device-verify-*.apk.sha256
            device-verify.apk
            device-verify.apk.sha256

      - name: 发布 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            device-verify-*.apk
            device-verify-*.apk.sha256
            device-verify.apk
            device-verify.apk.sha256
          generate_release_notes: true
